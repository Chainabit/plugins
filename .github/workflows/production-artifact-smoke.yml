name: production artifact smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: production-artifact-smoke
  cancel-in-progress: false

jobs:
  sandbox:
    name: registered generators and validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_SANDBOX_API_URL: ${{ secrets.CLOUDFLARE_SANDBOX_API_URL }}
      CLOUDFLARE_SANDBOX_API_KEY: ${{ secrets.CLOUDFLARE_SANDBOX_API_KEY }}
      CLOUDFLARE_SANDBOX_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_SANDBOX_ACCESS_CLIENT_ID }}
      CLOUDFLARE_SANDBOX_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_SANDBOX_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Verify production-equivalent artifact runtime
        run: node tooling/pdf-production-sandbox-smoke.mjs
